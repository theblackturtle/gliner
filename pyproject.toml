# GLiNER PII Server - Project Configuration
# Install system-wide with: uv pip install --system .
# Development installs: uv pip install --editable .

[project]
name = "gliner-pii"
version = "1.1.0"
description = "GLiNER PII detection server and CLI client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gliner>=0.2.0",
    "torch>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "click>=8.1.0"
]

[project.scripts]
gliner-server = "server:main"
gliner-client = "client:main"

[tool.setuptools]
py-modules = ["server", "scanner", "labels", "config", "client"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

