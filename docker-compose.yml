services:
  gliner-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gliner-pii-server
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for scanning files
      - ./data:/data:ro
      # Cache Hugging Face models to avoid re-downloading
      - ~/.cache/huggingface:/home/gliner/.cache/huggingface
    environment:
      # Model configuration
      - GLINER_MODEL_NAME=urchade/gliner_small-v2.1
      - GLINER_THRESHOLD=0.3
      - GLINER_USE_GPU=false
      
      # Performance configuration
      - GLINER_CHUNK_SIZE=8000
      - GLINER_BATCH_SIZE=8
      - GLINER_MAX_FILE_SIZE=50
      
      # Server configuration
      - GLINER_HOST=0.0.0.0
      - GLINER_PORT=8000
      - GLINER_LOG_LEVEL=info
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

