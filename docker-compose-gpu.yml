# Docker Compose with GPU Support (Linux with NVIDIA GPUs only)
# 
# This configuration enables NVIDIA GPU acceleration.
# Requirements:
#   - Linux host (not macOS or Windows)
#   - NVIDIA GPU with CUDA support
#   - nvidia-docker runtime installed
#
# Usage:
#   docker-compose -f docker-compose-gpu.yml up -d
#
# Note: This will NOT work on macOS (Docker can't access Metal/MPS)

services:
  gliner-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gliner-pii-server-gpu
    
    # NVIDIA GPU runtime
    runtime: nvidia
    
    ports:
      - "8000:8000"
    
    volumes:
      # Mount data directory for scanning files
      - ./data:/data:ro
      # Cache Hugging Face models to avoid re-downloading
      - ~/.cache/huggingface:/home/gliner/.cache/huggingface
    
    environment:
      # Model configuration
      - GLINER_MODEL_NAME=urchade/gliner_small-v2.1
      - GLINER_THRESHOLD=0.3
      - GLINER_USE_GPU=true  # Enable GPU
      
      # Performance configuration
      - GLINER_CHUNK_SIZE=8000
      - GLINER_BATCH_SIZE=16  # Increase for GPU
      - GLINER_MAX_FILE_SIZE=100  # Increase for GPU
      
      # Server configuration
      - GLINER_HOST=0.0.0.0
      - GLINER_PORT=8000
      - GLINER_LOG_LEVEL=info
    
    # GPU resource allocation
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1  # Number of GPUs to use
              capabilities: [gpu]
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

